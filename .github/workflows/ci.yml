name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pydantic pydantic-settings httpx pyyaml feedparser rank-bm25 numpy pytest ruff
      - run: ruff check src tests app eval
      - run: pytest -q
