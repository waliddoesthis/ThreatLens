services:
  api:
    build: .
    env_file: .env
    environment:
      - OLLAMA_API_BASE=http://ollama:11434
    volumes:
      - ./data:/app/data
    ports: ["8000:8000"]
    depends_on: [ollama]

  ui:
    build: .
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.address=0.0.0.0"]
    env_file: .env
    environment:
      - THREATLENS_API_URL=http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports: ["11434:11434"]

volumes:
  ollama:
