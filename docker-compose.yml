# Indexes live in ./data (build them first: `make ingest index`, or
# `docker compose run --rm api sh -c "python -m threatlens.ingest.run && python -m threatlens.index.build"`).
services:
  api:
    build: .
    env_file: .env
    environment:
      - OLLAMA_API_BASE=http://ollama:11434
    volumes:
      - ./data:/app/data
    ports: ["8000:8000"]
    depends_on: [ollama]

  ui:
    build: .
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.address=0.0.0.0"]
    env_file: .env
    environment:
      - THREATLENS_API_URL=http://api:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
    ports: ["8501:8501"]
    depends_on:
      api:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports: ["11434:11434"]

volumes:
  ollama:
