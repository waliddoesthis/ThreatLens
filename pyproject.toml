[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threatlens"
version = "0.1.0"
description = "Agentic RAG copilot for SOC & CTI analysts"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Walid Ichchou" }]
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "feedparser>=6.0",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=3.0",
  "qdrant-client>=1.10",
  "numpy>=1.26",
  "litellm>=1.40",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "streamlit>=1.35",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
eval = ["ragas>=0.1", "pandas>=2.2", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is handled by ruff format

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
